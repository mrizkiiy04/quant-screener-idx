<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Screener - Interactive Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --bg-hover: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --buy: #10b981;
            --sell: #ef4444;
            --hold: #f59e0b;
            --border: #334155;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sidebar-header p {
            margin: 0.25rem 0 0 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .ticker-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .ticker-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .ticker-item:hover {
            background: var(--bg-hover);
        }
        
        .ticker-item.active {
            background: var(--bg-hover);
            border-left: 4px solid var(--accent);
        }

        .ticker-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .ticker-price {
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .sig-badge {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .b-BUY { background: var(--buy); box-shadow: 0 0 8px var(--buy); }
        .b-SELL { background: var(--sell); box-shadow: 0 0 8px var(--sell); }
        .b-HOLD { background: var(--hold); }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
        }

        .stock-title h2 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
        }

        .signal-pill {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.05em;
        }
        .pill-BUY { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--buy); color: var(--buy); }
        .pill-SELL { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--sell); color: var(--sell); }
        .pill-HOLD { background: rgba(245, 158, 11, 0.2); border: 1px solid var(--hold); color: var(--hold); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin: 0 0 1.5rem 0;
            font-size: 1.1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .chart-container {
            min-height: 400px;
        }

        .rule-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .rule-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px dashed var(--border);
        }
        .rule-item:last-child {
            border-bottom: none;
        }

        .rule-name {
            font-weight: 500;
        }
        
        .rule-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-top: 0.25rem;
        }

        .status-icon {
            font-size: 1.25rem;
        }

        .stop-loss-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            text-align: center;
        }
        .sl-title { color: var(--sell); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .sl-value { font-size: 1.5rem; font-weight: 800; font-family: monospace; margin-top: 0.5rem; }

        /* Loader */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        @media (max-width: 900px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; height: 250px; border-right: none; border-bottom: 1px solid var(--border); }
            .dashboard-grid { grid-template-columns: 1fr; }
            .main-content { overflow: visible; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Quant Screener</h1>
            <p id="last-updated">Memuat data...</p>
        </div>
        <ul class="ticker-list" id="ticker-list">
            <!-- Disisipkan via JS -->
        </ul>
    </aside>

    <main class="main-content" id="main-content">
        <div class="loader">Tarik data sinyal...</div>
    </main>

    <script>
        let globalSignals = [];
        let chartInstance = null;

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        async function init() {
            try {
                const response = await fetch('signals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                globalSignals = data.signals;
                document.getElementById('last-updated').innerText = `Update: ${data.last_updated}`;
                
                renderSidebar();
                
                // Buka saham pertama otomatis (atau saham yang bersinyal BUY)
                const firstBuy = globalSignals.find(s => s.signal === 'BUY');
                if (firstBuy) {
                    selectTicker(firstBuy.ticker);
                } else if (globalSignals.length > 0) {
                    selectTicker(globalSignals[0].ticker);
                } else {
                    document.getElementById('main-content').innerHTML = '<div class="loader">Tidak ada data saham.</div>';
                }

            } catch (error) {
                document.getElementById('main-content').innerHTML = `
                    <div style="color:var(--sell); text-align:center; margin-top:2rem;">
                        Gagal memuat signals.json<br>${error.message}
                    </div>
                `;
            }
        }

        function renderSidebar() {
            const list = document.getElementById('ticker-list');
            list.innerHTML = '';
            
            // Urutkan: BUY di atas, lalu SELL, lalu HOLD
            globalSignals.sort((a, b) => {
                const val = (s) => s === 'BUY' ? 1 : (s === 'SELL' ? 2 : 3);
                return val(a.signal) - val(b.signal);
            });

            globalSignals.forEach(s => {
                const li = document.createElement('li');
                li.className = `ticker-item`;
                li.id = `item-${s.ticker.replace('.','_')}`;
                li.onclick = () => selectTicker(s.ticker);
                
                let sigClass = s.signal === 'BUY' ? 'b-BUY' : (s.signal === 'SELL' ? 'b-SELL' : 'b-HOLD');
                let sigText = s.signal === 'HOLD / WAIT' ? 'HOLD' : s.signal;

                li.innerHTML = `
                    <div>
                        <div class="ticker-name">${s.ticker}</div>
                        <div class="ticker-price">${formatRp(s.close)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="sig-badge ${sigClass}"></div>
                        <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">${sigText}</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function selectTicker(tickerStr) {
            // Hilangkan class active dari semua
            document.querySelectorAll('.ticker-item').forEach(el => el.classList.remove('active'));
            // Tambahkan ke yang terpilih
            const elId = `item-${tickerStr.replace('.','_')}`;
            const el = document.getElementById(elId);
            if(el) el.classList.add('active');

            const stock = globalSignals.find(s => s.ticker === tickerStr);
            if (!stock) return;

            renderMainContent(stock);
        }

        function renderMainContent(stock) {
            const main = document.getElementById('main-content');
            
            const sigClass = stock.signal === 'BUY' ? 'pill-BUY' : (stock.signal === 'SELL' ? 'pill-SELL' : 'pill-HOLD');
            const sigText = stock.signal === 'HOLD / WAIT' ? 'HOLD' : stock.signal;

            const r = stock.rules || {};
            const icon = (val) => val ? '✅' : '❌';

            main.innerHTML = `
                <div class="top-bar">
                    <div class="stock-title">
                        <h2>${stock.ticker}</h2>
                        <div style="color:var(--text-muted); font-family:monospace; font-size:1.2rem;">Close: ${formatRp(stock.close)}</div>
                    </div>
                    <div>
                        <div class="signal-pill ${sigClass}">${sigText}</div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <h3>Grafik Historis (90 Hari) & Bollinger Bands</h3>
                        <div id="chart" class="chart-container"></div>
                    </div>

                    <div class="card">
                        <h3>Analisis Strategi (Hari Ini)</h3>
                        <ul class="rule-list">
                            <li class="rule-item">
                                <div>
                                    <div class="rule-name">Oversold (%B < 0.05)</div>
                                    <div class="rule-desc">Harga anjlok menembus band bawah</div>
                                </div>
                                <div class="status-icon">${icon(r.oversold)}</div>
                            </li>
                            <li class="rule-item">
                                <div>
                                    <div class="rule-name">Regime (ADX < 20)</div>
                                    <div class="rule-desc">Tren sedang konsolidasi/sideways</div>
                                </div>
                                <div class="status-icon">${icon(r.regime)}</div>
                            </li>
                            <li class="rule-item">
                                <div>
                                    <div class="rule-name">Volume Valid (VR > 1.0)</div>
                                    <div class="rule-desc">Tekanan jual didukung volume besar</div>
                                </div>
                                <div class="status-icon">${icon(r.volume)}</div>
                            </li>
                            <li class="rule-item">
                                <div>
                                    <div class="rule-name">No Squeeze</div>
                                    <div class="rule-desc">Volatilitas sehat, tidak menyempit</div>
                                </div>
                                <div class="status-icon">${icon(!r.squeeze)}</div>
                            </li>
                        </ul>

                        <div class="stop-loss-box">
                            <div class="sl-title">Batas Cut Loss (ATR Trailing Stop)</div>
                            <div class="sl-value">${formatRp(stock.stop_loss)}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:0.5rem;">
                                Jual jika harga turun menyentuh batas ini. Jika harga naik, batas ini akan ikut naik besok.
                            </div>
                        </div>
                    </div>
                </div>
            `;

            renderChart(stock.chart);
        }

        function renderChart(chartData) {
            if (!chartData || chartData.length === 0) {
                document.getElementById('chart').innerHTML = '<div class="loader">Data chart tidak tersedia</div>';
                return;
            }

            const dates = chartData.map(d => d.date);
            const close = chartData.map(d => d.close);
            const upper = chartData.map(d => d.upper);
            const lower = chartData.map(d => d.lower);
            const sma = chartData.map(d => d.sma);

            const options = {
                series: [
                    { name: 'Close', data: close },
                    { name: 'Upper Band', data: upper },
                    { name: 'Lower Band', data: lower },
                    { name: 'SMA 20', data: sma }
                ],
                chart: {
                    type: 'line',
                    height: 400,
                    toolbar: { show: false },
                    animations: { enabled: false },
                    background: 'transparent'
                },
                theme: { mode: 'dark' },
                colors: ['#f8fafc', '#3b82f6', '#3b82f6', '#94a3b8'],
                stroke: {
                    width: [2, 1, 1, 1],
                    dashArray: [0, 4, 4, 0]
                },
                xaxis: {
                    categories: dates,
                    type: 'datetime',
                    labels: { style: { colors: '#94a3b8' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false }
                },
                yaxis: {
                    labels: {
                        formatter: (val) => new Intl.NumberFormat('id-ID').format(val),
                        style: { colors: '#94a3b8' }
                    }
                },
                grid: {
                    borderColor: '#334155',
                    strokeDashArray: 4,
                },
                dataLabels: { enabled: false },
                tooltip: {
                    theme: 'dark',
                    y: { formatter: (val) => 'Rp ' + new Intl.NumberFormat('id-ID').format(val) }
                },
                legend: {
                    position: 'top',
                    labels: { colors: '#f8fafc' }
                }
            };

            if (chartInstance) {
                chartInstance.destroy();
            }
            chartInstance = new ApexCharts(document.querySelector("#chart"), options);
            chartInstance.render();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
