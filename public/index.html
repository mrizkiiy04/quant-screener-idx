<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Screener - Premium Dashboard</title>
    <!-- Menggunakan font Outfit untuk kesan Premium Consumer / Modern Tech -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        /* High-End Brutalist/Minimalist Dark Tech Palette */
        :root {
            --bg-page: #09090b; /* Zinc 950 */
            --bg-panel: #18181b; /* Zinc 900 */
            --bg-hover: #27272a; /* Zinc 800 */
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --border: #27272a;
            
            /* High-contrast functional colors */
            --chart-close: #fbbf24; /* Amber 400 (Gold) */
            --chart-upper: #f87171; /* Red 400 */
            --chart-lower: #38bdf8; /* Sky 400 (Neon Blue) */
            --chart-sma: #52525b;   /* Zinc 600 */
            
            --profit: #10b981; /* Emerald 500 */
            --loss: #ef4444;   /* Red 500 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* -----------------------
           LAYOUT & SIDEBAR
           ----------------------- */
        .sidebar {
            width: 320px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }
        
        .sidebar-header p {
            margin: 0.5rem 0 0 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .ticker-list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .ticker-item {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s ease-out;
        }

        .ticker-item:hover {
            background: var(--bg-hover);
        }
        
        .ticker-item.active {
            background: var(--bg-page); /* Reverse contrast */
            border-left: 4px solid var(--chart-close);
        }

        .ticker-name {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
        }

        .ticker-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .sig-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .b-BUY { background: var(--chart-lower); box-shadow: 0 0 10px var(--chart-lower); }
        .b-SELL { background: var(--chart-upper); box-shadow: 0 0 10px var(--chart-upper); }
        .b-HOLD { background: var(--text-secondary); }

        /* -----------------------
           MAIN CONTENT
           ----------------------- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2.5rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2.5rem;
        }

        .stock-title h2 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin: 0 0 0.5rem 0;
        }

        .signal-pill {
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 4px; /* Brutalist sharp edge */
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .pill-BUY { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--chart-lower); color: var(--chart-lower); }
        .pill-SELL { background: rgba(248, 113, 113, 0.1); border: 1px solid var(--chart-upper); color: var(--chart-upper); }
        .pill-HOLD { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }

        /* -----------------------
           BENTO GRID
           ----------------------- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
        }

        .card-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        .chart-container {
            height: 550px;
            width: 100%;
        }

        /* -----------------------
           ANALYSIS PANEL (SIDEBAR)
           ----------------------- */
        .rule-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        .rule-item {
            padding: 1.5rem;
            background: var(--bg-page);
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .rule-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }
        
        .rule-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            line-height: 1.4;
        }

        .status-icon {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .stop-loss-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.2);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sl-title { color: var(--chart-upper); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; text-transform: uppercase; }
        .sl-value { font-size: 2rem; font-weight: 800; font-family: 'JetBrains Mono', monospace; }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
        }

        .hamburger-btn {
            display: none;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 998;
            backdrop-filter: blur(2px);
        }

        /* -----------------------
           RESPONSIVE
           ----------------------- */
        @media (max-width: 1024px) {
            body { flex-direction: column; overflow: auto; }
            .hamburger-btn { display: inline-block; }
            .sidebar { 
                position: fixed; 
                top: 0; bottom: 0; left: -320px; 
                width: 320px; 
                height: 100vh;
                z-index: 999;
                transition: transform 0.3s ease;
                border-right: 1px solid var(--border);
                border-bottom: none;
            }
            .sidebar.open { transform: translateX(320px); }
            .sidebar-overlay.active { display: block; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .main-content { overflow: visible; padding: 1.5rem; }
            .stop-loss-box { flex-direction: column; text-align: left; align-items: flex-start; gap: 1rem; }
        }
        @media (max-width: 768px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
            .stock-title > div { flex-direction: column; gap: 0.5rem !important; }
            .top-bar > div:last-child { flex-direction: column; width: 100%; align-items: stretch !important; gap: 0.5rem; }
            .signal-pill { text-align: center; }
            .chart-container { height: 350px; }
            /* Keep sidebar width same on phone */
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Screener Terminal</h1>
            <p id="last-updated">Updating signals...</p>
        </div>
        <ul class="ticker-list" id="ticker-list">
            <!-- Disisipkan via JS -->
        </ul>
    </aside>

    <main class="main-content" id="main-content">
        <button class="hamburger-btn" onclick="toggleSidebar()">☰ Pilih Saham</button>
        <div id="dashboard-body">
            <div class="loader">Initializing Engine...</div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.querySelector('.sidebar-overlay').classList.toggle('active');
        }
        let globalSignals = [];
        let chartInstance = null;
        let volChartInstance = null;
        let adxChartInstance = null;

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        async function init() {
            try {
                const response = await fetch('signals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                globalSignals = data.signals;
                document.getElementById('last-updated').innerText = `Sync: ${data.last_updated}`;
                
                renderSidebar();
                
                const firstBuy = globalSignals.find(s => s.signal === 'BUY');
                if (firstBuy) {
                    selectTicker(firstBuy.ticker);
                } else if (globalSignals.length > 0) {
                    selectTicker(globalSignals[0].ticker);
                } else {
                    document.getElementById('dashboard-body').innerHTML = '<div class="loader">No Universe Data.</div>';
                }

            } catch (error) {
                document.getElementById('dashboard-body').innerHTML = `
                    <div style="color:var(--chart-upper); text-align:center; margin-top:2rem; font-family:monospace;">
                        [ERR] Connection refused: signals.json<br>${error.message}
                    </div>
                `;
            }
        }

        function renderSidebar() {
            const list = document.getElementById('ticker-list');
            list.innerHTML = '';
            
            globalSignals.sort((a, b) => {
                const val = (s) => s === 'BUY' ? 1 : (s === 'SELL' ? 2 : 3);
                return val(a.signal) - val(b.signal);
            });

            globalSignals.forEach(s => {
                const li = document.createElement('li');
                li.className = `ticker-item`;
                li.id = `item-${s.ticker.replace('.','_')}`;
                li.onclick = () => selectTicker(s.ticker);
                
                let sigClass = s.signal === 'BUY' ? 'b-BUY' : (s.signal === 'SELL' ? 'b-SELL' : 'b-HOLD');
                let sigText = s.signal === 'HOLD / WAIT' ? 'HOLD' : s.signal;

                li.innerHTML = `
                    <div>
                        <div class="ticker-name">${s.ticker}</div>
                        <div class="ticker-price">${formatRp(s.close)}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="sig-badge ${sigClass}"></div>
                        <div style="font-family:monospace; font-size:0.75rem; color:var(--text-secondary); margin-top:6px;">${sigText}</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function selectTicker(tickerStr) {
            document.querySelectorAll('.ticker-item').forEach(el => el.classList.remove('active'));
            const elId = `item-${tickerStr.replace('.','_')}`;
            const el = document.getElementById(elId);
            if(el) el.classList.add('active');

            // Hide sidebar on mobile after selection
            if (window.innerWidth <= 1024) {
                document.querySelector('.sidebar').classList.remove('open');
                document.querySelector('.sidebar-overlay').classList.remove('active');
            }

            const stock = globalSignals.find(s => s.ticker === tickerStr);
            if (!stock) return;

            renderMainContent(stock);
        }

        function renderMainContent(stock) {
            const main = document.getElementById('dashboard-body');
            
            const sigClass = stock.signal === 'BUY' ? 'pill-BUY' : (stock.signal === 'SELL' ? 'pill-SELL' : 'pill-HOLD');
            const sigText = stock.signal === 'HOLD / WAIT' ? 'HOLD' : stock.signal;

            const r = stock.rules || {};
            const f = stock.fundamentals || {};
            const icon = (val) => val ? '✓' : '✗';
            const iconColor = (val) => val ? 'color: var(--chart-lower)' : 'color: var(--text-secondary)';

            let valClass = 'pill-HOLD';
            let valText = 'Fair Value: N/A';
            let fvHtml = '';
            
            if (f.status) {
                if (f.status === 'Harga Murah') {
                    valClass = 'pill-BUY'; // Greenish/Blueish neon
                    valText = 'DISCOUNT: ' + f.status.toUpperCase();
                } else if (f.status === 'Entry Wajar') {
                    valClass = 'pill-BUY'; 
                    valClass = 'pill-HOLD'; // Use border/gray or let's create a custom style inline
                    valText = 'FAIR: ENTRY WAJAR';
                } else if (f.status === 'Overvalued') {
                    valClass = 'pill-SELL'; 
                    valText = 'EXPENSIVE: OVERVALUED';
                }
                
                const marginPct = f.margin ? (f.margin * 100).toFixed(1) + '%' : 'N/A';
                
                fvHtml = `
                    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); text-align: center;">
                        <div class="card-header" style="margin-bottom: 0.5rem; border:none; padding:0; text-align:left;">Trend Strength (ADX)</div>
                        <div id="adx-chart" style="margin: -20px 0 -30px 0;"></div>
                        <div style="display:flex; justify-content:space-between; margin-bottom: 0.25rem; border-top: 1px solid #27272a; padding-top: 0.75rem;">
                            <span style="color:var(--text-secondary); font-size:0.75rem;">Margin of Safety</span>
                            <span style="font-family:'JetBrains Mono', monospace; font-size:0.75rem; color:${f.margin > 0 ? 'var(--profit)' : 'var(--loss)'}">${marginPct}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem;">
                            <span style="color:var(--text-secondary); font-size:0.75rem;">EPS / BV</span>
                            <span style="font-family:'JetBrains Mono', monospace; font-size:0.75rem;">${f.eps ? f.eps.toFixed(1) : '-'} / ${f.bv ? f.bv.toFixed(1) : '-'}</span>
                        </div>
                    </div>
                `;
            }

            main.innerHTML = `
                <div class="top-bar">
                    <div class="stock-title">
                        <h2>${stock.ticker}</h2>
                        <div style="display:flex; gap: 1.5rem; color:var(--text-secondary); font-family:'JetBrains Mono', monospace; font-size:1.1rem;">
                            <div>Close: <span style="color:var(--text-primary)">${formatRp(stock.close)}</span></div>
                            <div>Harga Wajar: <span style="color:${f.margin > 0 ? 'var(--chart-lower)' : 'var(--chart-upper)'}">${f.fair_value ? formatRp(f.fair_value) : 'N/A'}</span></div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.75rem; align-items: center;">
                        <div class="signal-pill ${valClass}" style="font-size: 0.85rem; padding: 0.5rem 1rem;">${valText}</div>
                        <div class="signal-pill ${sigClass}">${sigText}</div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <div class="card-header">Price Action & Bands (90d)</div>
                        <div id="chart" class="chart-container"></div>
                        <div id="chart-volume" class="chart-container" style="height: 150px; border-top: 1px dashed var(--border);"></div>
                    </div>

                    <div class="card">
                        <div class="card-header">Strategy Diagnostics</div>
                        
                        <div class="rule-grid">
                            <div class="rule-item" style="padding: 1rem;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div class="rule-name">Oversold Edge</div>
                                    <div class="status-icon" style="${iconColor(r.oversold)}; margin:0;">${icon(r.oversold)}</div>
                                </div>
                                <div class="rule-desc" style="margin-top:0.25rem;">Pct B &lt; 0.05. Harga tembus BB Bawah.</div>
                            </div>
                            <div class="rule-item" style="padding: 1rem;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div class="rule-name">Regime Check</div>
                                    <div class="status-icon" style="${iconColor(r.regime)}; margin:0;">${icon(r.regime)}</div>
                                </div>
                                <div class="rule-desc" style="margin-top:0.25rem;">ADX &lt; 20. Terhindar downtrend.</div>
                            </div>
                            <div class="rule-item" style="padding: 1rem;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div class="rule-name">Volume Valid</div>
                                    <div class="status-icon" style="${iconColor(r.volume)}; margin:0;">${icon(r.volume)}</div>
                                </div>
                                <div class="rule-desc" style="margin-top:0.25rem;">Vol Ratio &gt; 1.0x. Terjadi panic selling.</div>
                            </div>
                            <div class="rule-item" style="padding: 1rem;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div class="rule-name">No Squeeze</div>
                                    <div class="status-icon" style="${iconColor(!r.squeeze)}; margin:0;">${icon(!r.squeeze)}</div>
                                </div>
                                <div class="rule-desc" style="margin-top:0.25rem;">Volatilitas lebar memadai.</div>
                            </div>
                        </div>

                        <div class="stop-loss-box" style="margin-top: 1rem; padding: 1rem; display:block;">
                            <div class="sl-title" style="margin-bottom:0.5rem;">ATR Trailing Stop Limit</div>
                            <div class="sl-value" style="font-size:1.5rem;">${formatRp(stock.stop_loss)}</div>
                            <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.5rem;">
                                Titik invalidasi dinamis. Jual jika harga tutup tembus angka ini.
                            </div>
                        </div>
                        
                        ${fvHtml}
                    </div>
                </div>
            `;

            renderChart(stock.chart);
            renderADX(stock.adx || 0);
        }

        function renderADX(val) {
            if (adxChartInstance) {
                adxChartInstance.destroy();
                adxChartInstance = null;
            }

            // < 20 (Hijau, Sideways/MR), 20-25 (Kuning), >25 (Merah, Trending)
            let color = '#22c55e'; 
            if (val >= 20) color = '#fbbf24';
            if (val >= 25) color = '#ef4444';

            const options = {
                series: [val],
                chart: {
                    type: 'radialBar',
                    height: 250,
                    animations: { enabled: false },
                    fontFamily: "'JetBrains Mono', monospace"
                },
                plotOptions: {
                    radialBar: {
                        startAngle: -135,
                        endAngle: 135,
                        hollow: { size: '60%' },
                        track: { background: '#27272a', strokeWidth: '100%' },
                        dataLabels: {
                            name: {
                                fontSize: '12px',
                                color: '#a1a1aa',
                                offsetY: 25
                            },
                            value: {
                                fontSize: '28px',
                                color: '#fafafa',
                                offsetY: -10,
                                formatter: function(v) { return v.toFixed(1); }
                            }
                        }
                    }
                },
                colors: [color],
                labels: ['ADX']
            };

            const el = document.querySelector("#adx-chart");
            if(el) {
                adxChartInstance = new ApexCharts(el, options);
                adxChartInstance.render();
            }
        }

        function renderChart(chartData) {
            if (!chartData || chartData.length === 0) {
                document.getElementById('chart').innerHTML = '<div class="loader">Chart feed disconnected</div>';
                return;
            }

            const dates = chartData.map(d => d.date);
            const close = chartData.map(d => d.close);
            const upper = chartData.map(d => d.upper);
            const lower = chartData.map(d => d.lower);
            const sma = chartData.map(d => d.sma);
            const st_bull = chartData.map(d => (d.st_dir === 1 ? d.st : null));
            const st_bear = chartData.map(d => (d.st_dir === -1 ? d.st : null));

            const volData = chartData.map(d => d.volume || 0);

            const options = {
                series: [
                    { name: 'Close', data: close },
                    { name: 'Upper Band', data: upper },
                    { name: 'Lower Band', data: lower },
                    { name: 'SMA 20', data: sma },
                    { name: 'ST Bull', data: st_bull },
                    { name: 'ST Bear', data: st_bear }
                ],
                chart: {
                    type: 'line',
                    id: 'price-chart',
                    group: 'screener',
                    height: window.innerWidth <= 768 ? 350 : 550,
                    toolbar: { show: false },
                    animations: { enabled: false },
                    background: 'transparent',
                    fontFamily: "'JetBrains Mono', monospace"
                },
                theme: { mode: 'dark' },
                // Colors: Close, Upper, Lower, SMA, ST Bull, ST Bear
                colors: ['#fbbf24', '#f87171', '#38bdf8', '#52525b', '#22c55e', '#ef4444'],
                stroke: {
                    width: [2, 1, 1, 1, 2, 2],
                    curve: ['straight', 'straight', 'straight', 'straight', 'stepline', 'stepline'],
                    dashArray: [0, 4, 4, 0, 0, 0]
                },
                xaxis: {
                    categories: dates,
                    type: 'datetime',
                    labels: { style: { colors: '#a1a1aa' } },
                    axisBorder: { show: false },
                    axisTicks: { show: false },
                    tooltip: { enabled: false }
                },
                yaxis: {
                    labels: {
                        formatter: (val) => new Intl.NumberFormat('id-ID').format(val),
                        style: { colors: '#a1a1aa' }
                    }
                },
                grid: {
                    borderColor: '#27272a',
                    strokeDashArray: 2,
                    xaxis: { lines: { show: true } },
                    yaxis: { lines: { show: true } },
                },
                dataLabels: { enabled: false },
                tooltip: {
                    theme: 'dark',
                    y: { formatter: (val) => 'Rp ' + new Intl.NumberFormat('id-ID').format(val) }
                },
                legend: {
                    position: 'top',
                    horizontalAlign: 'left',
                    labels: { colors: '#fafafa' },
                    markers: { radius: 0 } // Square markers for brutalist feel
                }
            };

            const volOptions = {
                series: [{ name: 'Volume', data: volData }],
                chart: {
                    type: 'bar',
                    id: 'volume-chart',
                    group: 'screener',
                    height: 150,
                    toolbar: { show: false },
                    animations: { enabled: false },
                    background: 'transparent',
                    fontFamily: "'JetBrains Mono', monospace"
                },
                theme: { mode: 'dark' },
                colors: [
                    function(opts) {
                        const idx = opts.dataPointIndex;
                        if (idx === 0) return '#22c55e';
                        return close[idx] >= close[idx - 1] ? '#22c55e' : '#ef4444';
                    }
                ],
                plotOptions: {
                    bar: {
                        columnWidth: '80%',
                    }
                },
                dataLabels: { enabled: false },
                xaxis: {
                    categories: dates,
                    type: 'datetime',
                    labels: { show: false }, // Hide labels to keep it clean
                    axisBorder: { show: false },
                    axisTicks: { show: false },
                    tooltip: { enabled: false }
                },
                yaxis: {
                    labels: {
                        formatter: (val) => {
                            if(val >= 1000000000) return (val/1000000000).toFixed(1) + 'B';
                            if(val >= 1000000) return (val/1000000).toFixed(1) + 'M';
                            if(val >= 1000) return (val/1000).toFixed(0) + 'K';
                            return val;
                        },
                        style: { colors: '#a1a1aa', fontSize: '10px' }
                    }
                },
                grid: {
                    borderColor: '#27272a',
                    strokeDashArray: 2,
                },
                tooltip: { theme: 'dark' }
            };

            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            if (volChartInstance) {
                volChartInstance.destroy();
                volChartInstance = null;
            }
            
            chartInstance = new ApexCharts(document.querySelector("#chart"), options);
            chartInstance.render();
            
            volChartInstance = new ApexCharts(document.querySelector("#chart-volume"), volOptions);
            volChartInstance.render();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
