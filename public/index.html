<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Screener - Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            900: '#18181b',
                            950: '#09090b',
                        },
                        amber: {
                            400: '#fbbf24', // Gold
                        },
                        red: {
                            400: '#f87171',
                            500: '#ef4444',
                        },
                        sky: {
                            400: '#38bdf8', // Neon Blue
                        },
                        emerald: {
                            500: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            background-color: #09090b; /* bg-zinc-950 */
            color: #fafafa;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Loader Animation */
        .skeleton {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }
        
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-50 glass-panel border-b border-zinc-800/50">
        <div class="max-w-[1400px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold tracking-tight">Q-Screener</h1>
                <div class="hidden md:flex text-xs font-mono text-zinc-500 uppercase tracking-widest" id="last-updated">
                    Updating...
                </div>
            </div>
            
            <!-- Search Bar -->
            <div class="relative w-full max-w-sm">
                <input type="text" id="ticker-search" list="tickers-list" placeholder="Search Ticker..." 
                    class="w-full bg-zinc-900/80 border border-zinc-700 text-zinc-100 px-4 py-2.5 rounded-none font-mono text-sm focus:outline-none focus:border-sky-400 transition-colors placeholder:text-zinc-500">
                <datalist id="tickers-list"></datalist>
                <div class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs font-mono">D/L</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-[1400px] mx-auto px-6 py-8" id="dashboard-body">
        
        <!-- Skeleton Loader (Shown initially) -->
        <div id="loader" class="space-y-8 w-full animate-pulse">
            <div class="h-16 bg-zinc-900 rounded-none w-3/4"></div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 h-[500px] bg-zinc-900 rounded-none"></div>
                <div class="space-y-6">
                    <div class="h-48 bg-zinc-900 rounded-none"></div>
                    <div class="h-48 bg-zinc-900 rounded-none"></div>
                </div>
            </div>
        </div>
        
        <!-- Dashboard Content (Hidden initially) -->
        <div id="dashboard-content" class="hidden w-full flex flex-col gap-6">
            
            <!-- Header Section -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 border-b border-zinc-800 pb-6">
                <div>
                    <h2 class="text-4xl md:text-5xl font-extrabold tracking-tighter" id="stock-name">TICKER — COMPANY NAME</h2>
                    <div class="flex gap-6 mt-3 font-mono text-sm">
                        <div><span class="text-zinc-500 uppercase tracking-wider text-xs">Price</span><br><span id="stock-price" class="text-xl font-bold">Rp0</span></div>
                        <div><span class="text-zinc-500 uppercase tracking-wider text-xs">Fair Value</span><br><span id="stock-fair" class="text-xl">Rp0</span></div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col lg:grid lg:grid-cols-12 gap-6 items-start">
                
                <!-- Left Column: Chart (Span 8) -> Moved below on mobile via order -->
                <div class="lg:col-span-8 space-y-6 order-2 lg:order-1 w-full">
                    <div class="border border-zinc-800 bg-zinc-900/30 p-1 relative">
                        <div class="absolute top-4 left-4 z-10 pointer-events-none flex justify-between w-[calc(100%-2rem)]">
                            <span class="text-xs font-mono uppercase tracking-widest text-zinc-500">Price & Volume</span>
                        </div>
                        <div class="absolute top-3 right-4 z-20">
                            <button id="toggle-indicators" class="text-[10px] font-mono uppercase tracking-wider text-zinc-400 hover:text-sky-400 border border-zinc-700 bg-zinc-900/80 px-2 py-1 transition-colors">
                                Toggle Indicators
                            </button>
                        </div>
                        <div id="chart" class="h-[450px] w-full"></div>
                        <div id="chart-volume" class="h-[120px] w-full border-t border-zinc-800 border-dashed mt-2"></div>
                    </div>
                    
                    <!-- RSS News -->
                    <div class="border border-zinc-800 bg-zinc-900/30 p-6">
                        <h3 class="text-xs font-mono uppercase tracking-widest text-zinc-500 mb-4 border-b border-zinc-800 pb-2">Berita Relevan (RSS)</h3>
                        <div id="news-container" class="space-y-4">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>

                <!-- Right Column: AI Sentiment & Diagnostics (Span 4) -> Moved to top on mobile via order -->
                <div class="lg:col-span-4 space-y-6 flex flex-col order-1 lg:order-2 w-full">
                    
                    <!-- AI Sentiment Engine Card -->
                    <div class="border border-zinc-800 bg-zinc-900/50 p-6 relative overflow-hidden">
                        <h3 class="text-xs font-mono uppercase tracking-widest text-zinc-500 mb-4 flex items-center justify-between">
                            AI Sentiment Engine
                            <span class="flex h-2 w-2">
                              <span class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-sky-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
                            </span>
                        </h3>
                        
                        <div id="ai-header" class="border border-sky-400/30 bg-sky-400/5 p-4 flex items-center justify-between mb-6">
                            <div class="font-mono text-sm text-sky-400 tracking-wider" id="ai-score-label">[ NEUTRAL ]</div>
                            <div class="font-bold tracking-tight text-sky-400" id="ai-action">WAIT</div>
                        </div>

                        <ul id="ai-bullets" class="space-y-3 font-mono text-sm text-zinc-300">
                            <!-- Injected by JS -->
                        </ul>
                    </div>

                    <!-- Diagnostics Panel (The custom tooltip target & tech details) -->
                    <div class="border border-zinc-800 bg-zinc-900/30 p-6">
                        <h3 class="text-xs font-mono uppercase tracking-widest text-zinc-500 mb-4 border-b border-zinc-800 pb-2">Diagnostics Detail</h3>
                        
                        <div class="space-y-4 font-mono text-xs text-zinc-400">
                            <!-- Realtime Tooltip Data -->
                            <div id="tooltip-data" class="bg-zinc-950 p-4 border border-zinc-800 hidden">
                                <div class="text-zinc-500 mb-2" id="tt-date">YYYY-MM-DD</div>
                                <div id="tt-content" class="grid grid-cols-2 gap-2">
                                    <!-- Injected dynamically -->
                                </div>
                            </div>
                            
                            <!-- Static Rule Details -->
                            <div class="space-y-2 border-l-2 border-zinc-800 pl-3 pt-2" id="tech-diagnostics">
                                <!-- Injected by JS -->
                            </div>
                            
                            <!-- Dynamic Stop Loss -->
                            <div class="mt-4 pt-4 border-t border-zinc-800">
                                <div class="text-zinc-500 uppercase tracking-wider mb-1">ATR Trailing Stop</div>
                                <div class="text-lg font-bold text-red-400" id="stop-loss">Rp0</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Backtest Summary & ADX Gauge -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="border border-zinc-800 bg-zinc-900/30 p-4 flex flex-col justify-between">
                            <div class="text-xs font-mono uppercase tracking-widest text-zinc-500 mb-2 text-center">Trend (ADX)</div>
                            <div id="adx-chart" class="flex-1 -mt-4 -mb-4"></div>
                        </div>
                        <div class="border border-zinc-800 bg-zinc-900/30 p-4 font-mono text-xs flex flex-col justify-center">
                            <div class="text-zinc-500 uppercase tracking-widest mb-3 border-b border-zinc-800 pb-1">Backtest</div>
                            <div class="flex justify-between mb-1">
                                <span class="text-zinc-400">Avg Win Rate:</span>
                                <span id="bt-winrate" class="text-emerald-400">0%</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-zinc-400">Avg Profit:</span>
                                <span id="bt-profit" class="text-emerald-400">0%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="text-center font-mono text-xs text-zinc-600 uppercase tracking-widest mt-8 pb-4">
                * Data delayed by 15 minutes *
            </div>
        </div>
    </main>

    <script>
        let globalSignals = [];
        let globalParams = {};
        let chartInstance = null;
        let volChartInstance = null;
        let adxChartInstance = null;
        let indicatorsVisible = false;

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);

        async function init() {
            try {
                const response = await fetch('signals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                globalSignals = data.signals;
                globalParams = data.params || {};
                document.getElementById('last-updated').innerText = `Sync: ${data.last_updated}`;
                
                populateSearch();
                
                // Remove loader, show content
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');

                const firstBuy = globalSignals.find(s => s.signal === 'BUY');
                if (firstBuy) {
                    selectTicker(firstBuy.ticker);
                } else if (globalSignals.length > 0) {
                    selectTicker(globalSignals[0].ticker);
                }

            } catch (error) {
                document.getElementById('loader').innerHTML = `
                    <div class="text-red-400 text-center font-mono py-12">
                        [ERR] Connection refused: signals.json<br>${error.message}
                    </div>
                `;
            }
        }
        
        function populateSearch() {
            const list = document.getElementById('tickers-list');
            const input = document.getElementById('ticker-search');
            
            globalSignals.forEach(s => {
                const option = document.createElement('option');
                option.value = s.ticker;
                option.textContent = s.long_name || s.ticker;
                list.appendChild(option);
            });
            
            input.addEventListener('change', (e) => {
                const val = e.target.value.toUpperCase();
                if(globalSignals.some(s => s.ticker === val)) {
                    selectTicker(val);
                }
            });
            // Also handle enter key
            input.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    const val = e.target.value.toUpperCase();
                    if(globalSignals.some(s => s.ticker === val)) selectTicker(val);
                }
            });
        }

        function selectTicker(tickerStr) {
            document.getElementById('ticker-search').value = tickerStr;
            const stock = globalSignals.find(s => s.ticker === tickerStr);
            if (!stock) return;
            renderMainContent(stock);
        }

        function renderMainContent(stock) {
            // Header
            const titleName = stock.long_name && stock.long_name !== stock.ticker 
                ? `${stock.ticker} — ${stock.long_name}` 
                : stock.ticker;
            document.getElementById('stock-name').innerText = titleName;
            document.getElementById('stock-price').innerText = formatRp(stock.close);
            
            const f = stock.fundamentals || {};
            const margin = f.margin;
            let fairColor = 'text-zinc-500';
            if (margin !== null && margin !== undefined) fairColor = margin > 0 ? 'text-sky-400' : 'text-red-400';
            document.getElementById('stock-fair').innerText = f.fair_value ? formatRp(f.fair_value) : 'N/A';
            document.getElementById('stock-fair').className = `text-xl ${fairColor}`;

            // AI Sentiment
            const ai = stock.ai_sentiment || {};
            const aiHeader = document.getElementById('ai-header');
            const aiScore = document.getElementById('ai-score-label');
            const aiAction = document.getElementById('ai-action');
            
            let theme = 'text-zinc-400 border-zinc-700 bg-zinc-800/20'; // HOLD
            let scoreLabel = '[ NEUTRAL ]';
            if (ai.score > 60) {
                theme = 'text-sky-400 border-sky-400/30 bg-sky-400/5';
                scoreLabel = `[ BULLISH ${ai.score}% ]`;
            } else if (ai.score < 40) {
                theme = 'text-red-400 border-red-400/30 bg-red-400/5';
                scoreLabel = `[ BEARISH ${ai.score}% ]`;
            }
            
            aiHeader.className = `p-4 flex items-center justify-between mb-6 border ${theme}`;
            aiScore.innerText = scoreLabel;
            aiAction.innerText = ai.action || stock.signal;
            
            const bulletsHtml = (ai.bullets || []).map(b => `
                <li class="flex items-start gap-2">
                    <span class="text-sky-400 mt-1">•</span>
                    <span>${b}</span>
                </li>
            `).join('');
            document.getElementById('ai-bullets').innerHTML = bulletsHtml;

            // Diagnostics
            const r = stock.rules || {};
            const yesIcon = '<span class="text-emerald-400">✓ YES</span>';
            const noIcon = '<span class="text-red-400">✗ NO</span>';
            document.getElementById('tech-diagnostics').innerHTML = `
                <div>├─ Oversold Edge: Pct B < 0.05 ${r.oversold ? yesIcon : noIcon}</div>
                <div>├─ Regime Check: ADX < 20 ${r.regime ? yesIcon : noIcon}</div>
                <div>├─ Volume Panic: Vol > 1.0x ${r.volume ? yesIcon : noIcon}</div>
            `;
            document.getElementById('stop-loss').innerText = formatRp(stock.stop_loss);

            // Backtest
            const bt = stock.backtest_summary || {};
            document.getElementById('bt-winrate').innerText = bt.win_rate ? bt.win_rate.toFixed(1) + '%' : 'N/A';
            document.getElementById('bt-profit').innerText = bt.avg_profit ? bt.avg_profit.toFixed(1) + '%' : 'N/A';

            // RSS News
            const news = stock.news || [];
            let newsHtml = '<div class="text-zinc-500 font-mono text-sm">No recent news available.</div>';
            if (news.length > 0) {
                newsHtml = news.map(n => `
                    <div class="flex flex-col gap-1 cursor-pointer hover:bg-zinc-800/50 p-2 transition-colors -mx-2 rounded" onclick="window.open('${n.link}', '_blank')">
                        <div class="text-zinc-300 font-medium text-sm line-clamp-2">${n.title}</div>
                        <div class="text-zinc-600 font-mono text-[10px] uppercase">${n.published || 'Baru Saja'}</div>
                    </div>
                `).join('');
            }
            document.getElementById('news-container').innerHTML = newsHtml;

            // Render Charts
            renderChart(stock.chart, stock.forecast);
            renderADX(stock.adx || 0);
        }

        function renderADX(val) {
            if (adxChartInstance) adxChartInstance.destroy();

            let color = '#38bdf8'; // Sky 400 for Safe/Sideways
            let adxLabel = 'SIDEWAYS';
            if (val >= 20) { color = '#fbbf24'; adxLabel = 'TRENDING'; }
            if (val >= 25) { color = '#ef4444'; adxLabel = 'STRONG TREND'; }

            const options = {
                series: [val],
                chart: {
                    type: 'radialBar',
                    height: 180,
                    animations: { enabled: false },
                    fontFamily: "'JetBrains Mono', monospace",
                    sparkline: { enabled: true }
                },
                plotOptions: {
                    radialBar: {
                        startAngle: -135, endAngle: 135,
                        hollow: { size: '60%' },
                        track: { background: '#27272a', strokeWidth: '100%' },
                        dataLabels: {
                            name: { fontSize: '10px', color: '#a1a1aa', offsetY: 20 },
                            value: { fontSize: '24px', color: '#fafafa', offsetY: -5, formatter: (v) => v.toFixed(1) }
                        }
                    }
                },
                colors: [color],
                labels: [adxLabel]
            };

            adxChartInstance = new ApexCharts(document.querySelector("#adx-chart"), options);
            adxChartInstance.render();
        }

        function renderChart(chartData, forecast) {
            if (!chartData || chartData.length === 0) return;

            const dates = chartData.map(d => d.date);
            const close = chartData.map(d => d.close);
            const upper = chartData.map(d => d.upper);
            const lower = chartData.map(d => d.lower);
            const sma = chartData.map(d => d.sma);
            const st_bull = chartData.map(d => (d.st_dir === 1 ? d.st : null));
            const st_bear = chartData.map(d => (d.st_dir === -1 ? d.st : null));

            const pClose = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.close }));
            const pUpper = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.upper }));
            const pLower = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.lower }));
            const pSma = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.sma }));
            const pStBull = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.st_dir === 1 ? d.st : null }));
            const pStBear = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.st_dir === -1 ? d.st : null }));
            
            const pOhlc = chartData.map(d => ({
                x: new Date(d.date).getTime(),
                y: [d.open, d.high, d.low, d.close]
            }));

            const echoData = [];
            if (forecast && forecast.values && forecast.values.length > 0) {
                const lastDate = new Date(dates[dates.length - 1]).getTime();
                const startPrice = close[close.length - 1];
                echoData.push({ x: lastDate, y: startPrice });
                for (let i = 0; i < forecast.dates.length; i++) {
                    echoData.push({ x: new Date(forecast.dates[i]).getTime(), y: forecast.values[i] });
                }
            }

            const pVol = chartData.map(d => ({ x: new Date(d.date).getTime(), y: d.volume || 0 }));
            const pBollinger = chartData.map(d => ({ x: new Date(d.date).getTime(), y: [d.lower, d.upper] }));
            
            const annotationsPoints = [];
            let prevDir = null;
            chartData.forEach(d => {
                const ts = new Date(d.date).getTime();
                if (d.st_dir && d.st_dir !== prevDir) {
                    if (prevDir !== null) { 
                        if (d.st_dir === 1) {
                            annotationsPoints.push({
                                x: ts,
                                y: d.low,
                                marker: { size: 0 },
                                label: {
                                    text: 'BELI',
                                    style: { color: '#fff', background: '#10b981', fontSize: '10px', padding: { left: 4, right: 4, top: 2, bottom: 2 } },
                                    offsetY: 20
                                }
                            });
                        } else if (d.st_dir === -1) {
                            annotationsPoints.push({
                                x: ts,
                                y: d.high,
                                marker: { size: 0 },
                                label: {
                                    text: 'JUAL',
                                    style: { color: '#fff', background: '#ef4444', fontSize: '10px', padding: { left: 4, right: 4, top: 2, bottom: 2 } },
                                    offsetY: -20
                                }
                            });
                        }
                    }
                    prevDir = d.st_dir;
                }
            });

            const ttData = document.getElementById('tooltip-data');
            
            const options = {
                series: [
                    { name: 'Candle', type: 'candlestick', data: pOhlc },
                    { name: 'Bollinger', type: 'rangeArea', data: pBollinger },
                    { name: 'Echo', type: 'line', data: echoData }
                ],
                // Hidden indicators stored in state
                _extraSeries: [
                    { name: 'SMA', type: 'line', data: pSma },
                    { name: 'ST Bull', type: 'line', data: pStBull },
                    { name: 'ST Bear', type: 'line', data: pStBear }
                ],
                annotations: {
                    points: annotationsPoints
                },
                chart: {
                    type: 'line', id: 'price-chart', group: 'screener',
                    height: 450, toolbar: { show: false }, animations: { enabled: false },
                    background: 'transparent', fontFamily: "'JetBrains Mono', monospace"
                },
                theme: { mode: 'dark' },
                colors: ['#f87171', '#38bdf8', '#c084fc', '#52525b', '#10b981', '#ef4444'], // expanded for extra series
                plotOptions: {
                    candlestick: { colors: { upward: '#fbbf24', downward: '#ef4444' } }
                },
                fill: {
                    opacity: [1, 0.1, 1, 1, 1, 1]
                },
                stroke: {
                    width: [1, 0, 2, 1, 2, 2], // Candle 1, Bollinger 0, Echo 2, SMA 1, ST Bull 2, ST Bear 2
                    curve: ['straight', 'straight', 'smooth', 'straight', 'stepline', 'stepline'],
                    dashArray: [0, 0, 5, 4, 0, 0]
                },
                xaxis: {
                    type: 'datetime',
                    labels: { style: { colors: '#71717a' }, format: 'dd MMM' },
                    axisBorder: { show: false }, axisTicks: { show: false }, tooltip: { enabled: false }
                },
                yaxis: {
                    labels: { formatter: (val) => new Intl.NumberFormat('id-ID').format(val), style: { colors: '#71717a', fontSize: '10px' } }
                },
                grid: { borderColor: '#27272a', strokeDashArray: 2, xaxis: { lines: { show: true } }, yaxis: { lines: { show: true } } },
                dataLabels: { enabled: false },
                tooltip: { 
                    enabled: true,
                    custom: function({series, seriesIndex, dataPointIndex, w}) {
                        const ttData = document.getElementById('tooltip-data');
                        ttData.classList.remove('hidden');
                        const currentDate = w.globals.seriesX[seriesIndex][dataPointIndex];
                        if (!currentDate) return '<div style="display:none;"></div>';
                        
                        // Format date string
                        const dateStr = new Date(currentDate).toISOString().split('T')[0];
                        
                        // Find matching values for this date
                        const cOhlc = pOhlc.find(d => d.x === currentDate);
                        const cVol = pVol.find(d => d.x === currentDate);
                        const cUpper = pUpper.find(d => d.x === currentDate);
                        const cLower = pLower.find(d => d.x === currentDate);
                        const cEcho = echoData.find(d => d.x === currentDate);
                        
                        document.getElementById('tt-date').innerText = dateStr;
                        const ttContent = document.getElementById('tt-content');
                        
                        if (cOhlc && cOhlc.y) {
                            ttContent.innerHTML = `
                                <div>Close: <span class="text-amber-400 font-bold">${formatRp(cOhlc.y[3])}</span></div>
                                <div>Vol: <span class="text-zinc-100">${(cVol.y/1000000).toFixed(1)}M</span></div>
                                <div>Upper: <span class="text-red-400">${formatRp(cUpper.y)}</span></div>
                                <div>Lower: <span class="text-sky-400">${formatRp(cLower.y)}</span></div>
                            `;
                        } else if (cEcho && cEcho.y) {
                            ttContent.innerHTML = `
                                <div class="col-span-2">Echo Forecast: <span class="text-purple-400 font-bold">${formatRp(cEcho.y)}</span></div>
                            `;
                        } else {
                            ttContent.innerHTML = ``;
                        }
                        
                        return '<div style="display:none;"></div>';
                    }
                },
                legend: { show: false } 
            };

            const volOptions = {
                series: [{ name: 'Volume', type: 'bar', data: pVol }],
                chart: {
                    type: 'bar', id: 'volume-chart', group: 'screener',
                    height: 100, toolbar: { show: false }, animations: { enabled: false },
                    background: 'transparent'
                },
                dataLabels: { enabled: false },
                theme: { mode: 'dark' },
                colors: [({ value, seriesIndex, dataPointIndex, w }) => {
                    const cOhlc = pOhlc[dataPointIndex];
                    if (!cOhlc || !cOhlc.y) return '#3f3f46';
                    return cOhlc.y[3] >= cOhlc.y[0] ? '#10b981' : '#ef4444';
                }],
                xaxis: {
                    type: 'datetime',
                    labels: { show: false }, axisBorder: { show: false }, axisTicks: { show: false }, tooltip: { enabled: false }
                },
                yaxis: {
                    labels: {
                        formatter: (val) => {
                            if(val >= 1000000000) return (val/1000000000).toFixed(1) + 'B';
                            if(val >= 1000000) return (val/1000000).toFixed(1) + 'M';
                            return val;
                        },
                        style: { colors: '#71717a', fontSize: '10px' }
                    }
                },
                grid: { borderColor: '#27272a', strokeDashArray: 2 },
                tooltip: { enabled: false } // Synchronized with price chart, we handle in price chart event
            };

            if (chartInstance) chartInstance.destroy();
            if (volChartInstance) volChartInstance.destroy();
            
            const chartDiv = document.querySelector("#chart");
            chartInstance = new ApexCharts(chartDiv, options);
            chartInstance.render();
            
            // Handle mouseleave cleanly via native event
            chartDiv.addEventListener('mouseleave', () => {
                const ttData = document.getElementById('tooltip-data');
                if (ttData) ttData.classList.add('hidden');
            });
            
            volChartInstance = new ApexCharts(document.querySelector("#chart-volume"), volOptions);
            volChartInstance.render();
            
            // Toggle Indicators Event
            const toggleBtn = document.getElementById('toggle-indicators');
            if (toggleBtn) {
                // Remove old listeners by cloning
                const newBtn = toggleBtn.cloneNode(true);
                toggleBtn.parentNode.replaceChild(newBtn, toggleBtn);
                newBtn.addEventListener('click', () => {
                    indicatorsVisible = !indicatorsVisible;
                    if (indicatorsVisible) {
                        const allSeries = [
                            { name: 'Candle', type: 'candlestick', data: pOhlc },
                            { name: 'Bollinger', type: 'rangeArea', data: pBollinger },
                            { name: 'Echo', type: 'line', data: echoData },
                            ...options._extraSeries
                        ];
                        chartInstance.updateSeries(allSeries);
                        chartInstance.updateOptions({
                            stroke: {
                                width: [1, 0, 2, 1, 2, 2],
                                curve: ['straight', 'straight', 'smooth', 'straight', 'stepline', 'stepline'],
                                dashArray: [0, 0, 5, 4, 0, 0]
                            },
                            colors: ['#f87171', '#38bdf8', '#c084fc', '#52525b', '#10b981', '#ef4444'],
                            fill: { opacity: [1, 0.1, 1, 1, 1, 1] }
                        });
                        newBtn.classList.add('text-sky-400');
                    } else {
                        const baseSeries = [
                            { name: 'Candle', type: 'candlestick', data: pOhlc },
                            { name: 'Bollinger', type: 'rangeArea', data: pBollinger },
                            { name: 'Echo', type: 'line', data: echoData }
                        ];
                        chartInstance.updateSeries(baseSeries);
                        chartInstance.updateOptions({
                            stroke: {
                                width: [1, 0, 2],
                                curve: ['straight', 'straight', 'smooth'],
                                dashArray: [0, 0, 5]
                            },
                            colors: ['#f87171', '#38bdf8', '#c084fc'],
                            fill: { opacity: [1, 0.1, 1] }
                        });
                        newBtn.classList.remove('text-sky-400');
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
