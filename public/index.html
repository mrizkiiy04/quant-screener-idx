<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant Screener - Bollinger Bands v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --buy-color: #10b981;
            --sell-color: #ef4444;
            --hold-color: #f59e0b;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meta-info {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background-color: #0f172a;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .ticker {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .signal-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            min-width: 80px;
        }

        .sig-BUY { background-color: rgba(16, 185, 129, 0.2); color: var(--buy-color); border: 1px solid var(--buy-color); }
        .sig-SELL { background-color: rgba(239, 68, 68, 0.2); color: var(--sell-color); border: 1px solid var(--sell-color); }
        .sig-HOLD { background-color: rgba(245, 158, 11, 0.2); color: var(--hold-color); border: 1px solid var(--hold-color); }

        .price {
            font-family: monospace;
            font-size: 1.05rem;
        }

        .metrics {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .loader {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr {
                margin-bottom: 1rem;
                border: 1px solid #334155;
                border-radius: 8px;
            }
            td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
            }
            td:before {
                position: absolute;
                top: 1rem;
                left: 1rem;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: 600;
                color: var(--text-muted);
                content: attr(data-label);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Quant Screener</h1>
            <div class="meta-info">Strategi: Bollinger Bands v2 (Golden Strategy)</div>
            <div class="meta-info" id="last-updated">Memuat data...</div>
        </header>

        <div id="content">
            <div class="loader">Mengambil sinyal hari ini...</div>
        </div>
    </div>

    <script>
        async function fetchSignals() {
            try {
                // Tambah query string dummy agar tidak di-cache oleh browser agresif
                const response = await fetch('signals.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Data tidak ditemukan');
                const data = await response.json();
                
                document.getElementById('last-updated').innerText = `Terakhir Update: ${data.last_updated}`;
                
                renderTable(data.signals);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div style="text-align:center; color:#ef4444; padding:2rem;">
                        <strong>Gagal memuat data sinyal.</strong><br>
                        ${error.message}
                    </div>
                `;
            }
        }

        function formatRp(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function renderTable(signals) {
            if (!signals || signals.length === 0) {
                document.getElementById('content').innerHTML = '<div class="loader">Tidak ada data saham untuk dianalisa.</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Tanggal</th>
                            <th>Close</th>
                            <th>Sinyal</th>
                            <th>Batas Cut Loss (ATR Stop)</th>
                            <th>Metrik Internal</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            signals.forEach(s => {
                const sigClass = s.signal === 'BUY' ? 'sig-BUY' : (s.signal === 'SELL' ? 'sig-SELL' : 'sig-HOLD');
                const sigText = s.signal === 'HOLD / WAIT' ? 'HOLD' : s.signal;
                
                html += `
                    <tr>
                        <td data-label="Ticker" class="ticker">${s.ticker}</td>
                        <td data-label="Tanggal">${s.date}</td>
                        <td data-label="Close" class="price">${formatRp(s.close)}</td>
                        <td data-label="Sinyal">
                            <span class="signal-badge ${sigClass}">${sigText}</span>
                        </td>
                        <td data-label="ATR Stop" class="price" style="color:var(--sell-color)">
                            ${formatRp(s.stop_loss)}
                        </td>
                        <td data-label="Metrik" class="metrics">
                            ADX: ${s.adx.toFixed(1)} | %B: ${s.pct_b.toFixed(2)} | VR: ${s.vol_ratio.toFixed(2)}
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            document.getElementById('content').innerHTML = html;
        }

        // Jalankan saat halaman dimuat
        document.addEventListener('DOMContentLoaded', fetchSignals);
    </script>
</body>
</html>
